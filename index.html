<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASTRALIS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: trilho de navegação + telas em camadas; Personagem segue o HSR, Invocação segue o Genshin.
   Tema único e escuro por escolha (a tela de invocação tem seu céu claro próprio). */
:root{
  --bg:#070A16;--bg2:#0E1430;--bg3:#16204A;--ink:#E9EEF8;--mut:rgba(233,238,248,.62);--dim:rgba(233,238,248,.38);
  --line:rgba(233,238,248,.12);--line2:rgba(233,238,248,.22);--glass:rgba(16,22,46,.62);--glass2:rgba(24,32,64,.78);
  --gold:#E3C78A;--vio:#A38BFF;--blue:#80CFFF;--rose:#E35D8C;--ok:#7FD6A6;--bad:#FF7B7B;--el:#A38BFF;
  --r3:#6FA8DC;--r4:#A77BE8;--r5:#E3B05A;
  --pill:#ECE5D8;--pill-tx:#495366;--sky1:#7FA9DE;--sky2:#CFE2F6;
  --ft:'Cinzel',Georgia,'Times New Roman',serif;--fu:'Rajdhani','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--ink)}
body{margin:0;font:500 15px/1.4 var(--fu);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
button:disabled{cursor:not-allowed;opacity:.45}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.g{width:20px;height:20px;fill:currentColor;flex:none}
.tab{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- fundo cósmico ---------- */
.cos{position:fixed;inset:0;background:
  radial-gradient(55% 45% at 50% 40%,color-mix(in srgb,var(--el) 30%,transparent),transparent 70%),
  radial-gradient(40% 40% at 8% 95%,rgba(41,43,80,.95),transparent 70%),
  radial-gradient(30% 30% at 95% 6%,rgba(227,93,140,.12),transparent 70%),
  linear-gradient(#060914,#0D1330 60%,#17204A);transition:background .8s}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}

/* ---------- casca ---------- */
.app{position:relative;z-index:2;height:100%;display:grid;grid-template-columns:78px minmax(0,1fr)}
.rail{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0 14px;border-right:1px solid var(--line);background:linear-gradient(90deg,rgba(6,9,20,.85),rgba(6,9,20,.5))}
.brand{font:700 11px var(--ft);letter-spacing:.32em;color:var(--gold);writing-mode:vertical-rl;rotate:180deg;margin:4px 0 12px}
.nv{position:relative;display:grid;justify-items:center;gap:3px;width:64px;padding:8px 0;border-radius:10px;color:var(--dim);transition:color .25s,background .25s}
.nv .g{width:26px;height:26px;transition:transform .3s}
.nv span{font-size:11px;letter-spacing:.05em}
.nv:hover{color:var(--ink)}
.nv.on{color:var(--ink);background:linear-gradient(90deg,color-mix(in srgb,var(--el) 26%,transparent),transparent)}
.nv.on::before{content:"";position:absolute;left:-7px;top:12px;bottom:12px;width:3px;border-radius:2px;background:var(--el);box-shadow:0 0 12px var(--el)}
.nv.on .g{transform:scale(1.08);color:var(--el)}
.nv .dot{position:absolute;top:6px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--rose);box-shadow:0 0 8px var(--rose)}
.rail .sp{flex:1}
.who{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--fu);background:var(--bg3);border:1px solid var(--line2);overflow:hidden}
.who img{width:100%;height:100%;object-fit:cover}
.main{position:relative;min-width:0;min-height:0}
.scr{position:absolute;inset:0;display:none;min-height:0}
.scr.on{display:grid;animation:scrIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes scrIn{from{opacity:0;transform:translateY(8px)}}

/* ---------- HUD de moedas ---------- */
.hud{position:absolute;top:14px;right:18px;z-index:5;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:flex;align-items:center;gap:6px;height:30px;padding:0 12px 0 8px;border-radius:15px;background:rgba(8,12,28,.6);border:1px solid var(--line);font-weight:600;font-size:14px;white-space:nowrap}
.chip .g{width:18px;height:18px}
.chip small{font-size:11px;color:var(--mut);font-weight:500}

/* ---------- elementos comuns ---------- */
.ttl{font:500 13px var(--fu);letter-spacing:.28em;text-transform:uppercase;color:var(--mut)}
.h1{font:500 34px/1.05 var(--ft);letter-spacing:.04em;margin:0;text-wrap:balance}
.stars{display:inline-flex;gap:1px;color:var(--gold);font-size:13px;letter-spacing:-1px}
.pillb{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 22px;border-radius:21px;background:var(--pill);color:var(--pill-tx);font-weight:700;font-size:15px;letter-spacing:.03em;box-shadow:0 2px 0 rgba(0,0,0,.25);transition:filter .2s,transform .15s}
.pillb:hover{filter:brightness(1.06)}.pillb:active{transform:scale(.97)}
.pillb.dk{background:rgba(233,238,248,.1);color:var(--ink);border:1px solid var(--line2);box-shadow:none}
.pillb.gold{background:linear-gradient(#F1D9A2,#D9B46A);color:#3A2D12}
.pillb.sm{height:32px;padding:0 14px;font-size:13px}
.pillb.wide{width:100%}
.lnk{color:var(--blue);font-weight:600}
.seg{display:flex;padding:3px;border-radius:18px;background:rgba(233,238,248,.08);border:1px solid var(--line)}
.seg button{flex:1;height:30px;border-radius:15px;font-weight:600;font-size:14px;color:var(--mut);transition:.2s}
.seg button.on{background:var(--ink);color:#1A2142}
.empty{display:grid;justify-items:center;gap:10px;padding:28px 14px;text-align:center;color:var(--mut);font-size:14px}
.empty .g{width:44px;height:44px;opacity:.5}
.note{font-size:13px;color:var(--mut);line-height:1.45}
.bar{height:5px;border-radius:3px;background:rgba(233,238,248,.14);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--vio),var(--blue));border-radius:3px;transition:width .5s}
.ico{position:relative;display:grid;place-items:center;flex:none;width:56px;height:56px;border-radius:10px 10px 18px 10px;background:linear-gradient(160deg,color-mix(in srgb,var(--rc,#6FA8DC) 70%,#0E1430),color-mix(in srgb,var(--rc,#6FA8DC) 30%,#0E1430));border:1px solid color-mix(in srgb,var(--rc,#6FA8DC) 60%,transparent);color:#fff}
.ico .g{width:58%;height:58%;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.ico b{position:absolute;right:-4px;bottom:-4px;min-width:22px;height:18px;padding:0 5px;border-radius:9px;background:#0A0F24;border:1px solid var(--line2);font-size:11px;line-height:16px;text-align:center}
.elb{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:rgba(8,12,28,.7);border:1px solid color-mix(in srgb,var(--ec) 70%,transparent);color:var(--ec)}
.elb .g{width:15px;height:15px}

/* ======================== PERSONAGEM (HSR) ======================== */
#s-char{grid-template-columns:220px minmax(0,1fr) minmax(330px,380px);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top top" "tabs stage panel"}
.c-top{grid-area:top;display:flex;align-items:flex-start;gap:16px;padding:16px 22px 4px;min-width:0}
.crumb{display:flex;gap:10px;align-items:center;min-width:0}
.crumb .g{width:28px;height:28px;color:var(--mut)}
.crumb small{display:block;font-size:12px;color:var(--mut);letter-spacing:.04em}
.crumb b{display:flex;align-items:center;gap:6px;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b .g{width:17px;height:17px;color:var(--ink)}
.ports{position:absolute;left:50%;top:12px;translate:-50% 0;display:flex;gap:10px;z-index:4;max-width:44%;overflow-x:auto;scrollbar-width:none;padding:4px}
.port{position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;flex:none;overflow:hidden;background:var(--bg3);border:2px solid var(--line2);transition:.25s}
.port img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.port .g{width:24px;height:24px;color:var(--mut)}
.port.on{border-color:var(--ink);box-shadow:0 0 0 3px rgba(233,238,248,.2),0 0 14px var(--pc)}
.port:hover{border-color:var(--ink)}
.c-tabs{grid-area:tabs;display:flex;flex-direction:column;gap:8px;padding:56px 0 0 30px}
.ct{display:flex;align-items:center;gap:14px;height:44px;padding:0 14px 0 6px;font-size:16px;font-weight:600;color:var(--mut);border-radius:22px;transition:.25s;text-align:left}
.ct i{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;transition:.25s}
.ct .g{width:19px;height:19px}
.ct:hover{color:var(--ink)}
.ct.on{color:var(--ink)}
.ct.on i{background:var(--ink);color:#18203F;box-shadow:0 0 16px rgba(233,238,248,.4)}
.c-stage{grid-area:stage;position:relative;min-height:0;overflow:hidden}
.plat{position:absolute;left:50%;bottom:6%;width:min(130%,900px);translate:-50% 0;pointer-events:none}
.arcs{animation:arcs 60s linear infinite;transform-origin:450px 150px}
@keyframes arcs{to{transform:rotate(360deg)}}
.beam{position:absolute;left:50%;bottom:13%;width:min(46%,320px);height:80%;translate:-50% 0;background:linear-gradient(to top,color-mix(in srgb,var(--el) 40%,transparent),rgba(128,207,255,.05) 70%,transparent);clip-path:polygon(30% 0,70% 0,100% 100%,0 100%);opacity:.7;animation:pls 6s ease-in-out infinite}
@keyframes pls{50%{opacity:.4}}
/* a arte sempre cabe inteira no palco (qualquer proporção): a caixa da imagem = área pintada, com as bordas suavizadas */
.hero{position:absolute;left:4%;right:4%;top:5%;bottom:11%;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.hero img{display:block;width:auto;height:auto;max-width:min(100%,560px);max-height:100%;min-height:0;object-fit:contain;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 6%,#000 86%,transparent),linear-gradient(to right,transparent,#000 6%,#000 94%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(to bottom,transparent,#000 6%,#000 86%,transparent),linear-gradient(to right,transparent,#000 6%,#000 94%,transparent);mask-composite:intersect;filter:drop-shadow(0 18px 30px rgba(0,0,0,.55));animation:breath 6s ease-in-out infinite}
.hero img{flex:none}
@keyframes breath{50%{transform:translateY(-6px)}}
.sil{height:44%;margin-bottom:9%;aspect-ratio:1/1.2;display:grid;place-items:center;color:color-mix(in srgb,var(--el) 70%,#fff);opacity:.9;animation:breath 6s ease-in-out infinite}
.sil svg{width:100%;height:100%;filter:drop-shadow(0 0 30px var(--el))}
.c-stage .cap{position:absolute;left:50%;bottom:3%;translate:-50% 0;font-size:12px;letter-spacing:.24em;color:var(--mut);white-space:nowrap}
.c-panel{grid-area:panel;min-height:0;overflow:auto;padding:58px 26px 22px 6px;scrollbar-width:thin;display:flex;flex-direction:column;gap:12px}
.c-name{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.c-name h2{font:600 30px/1 var(--fu);letter-spacing:.02em;margin:0}
.c-name .elb{width:34px;height:34px}.c-name .elb .g{width:22px;height:22px}
.c-path{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:15px}
.c-path .g{width:18px;height:18px}
.pips{display:flex;gap:6px;margin:2px 0}
.pips i{width:9px;height:9px;rotate:45deg;border:1px solid var(--line2)}
.pips i.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 8px var(--gold)}
.c-lv{display:flex;align-items:baseline;gap:6px;font-size:15px;color:var(--mut)}
.c-lv b{font-size:30px;color:var(--ink);font-weight:600}
.c-lv span{font-size:18px}
.stl{list-style:none;margin:0;padding:0}
.stl li{display:flex;align-items:center;gap:10px;padding:7px 4px;font-size:15px;border-bottom:1px solid rgba(233,238,248,.06)}
.stl li .g{width:18px;height:18px;color:var(--mut)}
.stl li span{flex:1;color:var(--mut)}
.stl li b{font-weight:600;font-variant-numeric:tabular-nums}
.stl li em{font-style:normal;font-size:12px;color:var(--ok);margin-left:6px}
.stl .gp{padding:12px 4px 2px;font-size:11px;letter-spacing:.24em;color:var(--blue);border:0}
.more{align-self:flex-end}
.wslot{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;background:var(--glass);border:1px solid var(--line);text-align:left;width:100%}
.wslot .ico{width:64px;height:64px}
.wslot .plus{display:grid;place-items:center;width:64px;height:64px;border-radius:10px;border:1px dashed var(--line2);font-size:30px;color:var(--mut)}
.wslot b{display:block;font-size:15px}.wslot small{color:var(--mut);font-size:13px}
.sk{padding:10px 12px;border-radius:12px;background:var(--glass);border:1px solid var(--line)}
.sk small{font-size:11px;letter-spacing:.2em;color:var(--blue)}
.sk h4{margin:2px 0 4px;font-size:16px}
.sk p{margin:0;font-size:13.5px;color:var(--mut)}
.eid{display:grid;grid-template-columns:42px 1fr;gap:12px;align-items:center;padding:8px 0;opacity:.5}
.eid.on{opacity:1}
.eid i{display:grid;place-items:center;width:38px;height:38px;rotate:45deg;border:1px solid var(--line2);font:700 13px var(--ft)}
.eid i b{rotate:-45deg}
.eid.on i{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 22%,transparent);box-shadow:0 0 14px -2px var(--gold)}
.eid h4{margin:0;font-size:15px}.eid p{margin:0;font-size:13px;color:var(--mut)}
.rsl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rs{display:grid;justify-items:center;gap:4px;padding:10px 4px;border-radius:12px;background:var(--glass);border:1px solid var(--line);font-size:12px;color:var(--mut)}
.rs .ico{width:46px;height:46px}
.rs.on{border-color:var(--ink);color:var(--ink)}
.rs.mt .ico{--rc:#3C4466;opacity:.6}

/* ======================== INVOCAÇÃO (Genshin) ======================== */
#s-wish{position:fixed;inset:0;z-index:20;grid-template-columns:150px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top top" "bns card" "foot foot";color:#fff;padding:env(safe-area-inset-top,0px) max(0px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(0px,env(safe-area-inset-left,0px));
  background:radial-gradient(60% 50% at 70% 40%,rgba(255,255,255,.55),transparent 70%),linear-gradient(170deg,#6E9BD8 0%,#9DC1EA 40%,#D8E8F7 75%,#EEF4FB 100%);overflow:hidden}
.clouds{position:absolute;inset:0;pointer-events:none;opacity:.85;background:
  radial-gradient(18% 9% at 12% 78%,#fff,transparent 70%),radial-gradient(22% 10% at 30% 88%,#fff,transparent 70%),
  radial-gradient(26% 11% at 78% 86%,#fff,transparent 70%),radial-gradient(16% 7% at 92% 70%,rgba(255,255,255,.9),transparent 70%),
  radial-gradient(20% 8% at 55% 95%,#fff,transparent 70%),radial-gradient(14% 6% at 64% 18%,rgba(255,255,255,.6),transparent 70%),
  radial-gradient(12% 5% at 20% 22%,rgba(255,255,255,.55),transparent 70%)}
.clouds::after{content:"";position:absolute;inset:0;background:radial-gradient(1px 1px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 70% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 40% 60%,#fff,transparent),radial-gradient(1px 1px at 85% 45%,#fff,transparent);opacity:.7}
.w-top{grid-area:top;position:relative;display:flex;align-items:center;gap:14px;padding:14px 20px 6px 22px}
.w-title{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:600;text-shadow:0 1px 3px rgba(40,60,100,.4);flex:1}
.w-title .g{width:30px;height:30px;color:#fff;filter:drop-shadow(0 0 6px rgba(255,255,255,.8))}
.w-cur{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.wc{display:flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 8px;border-radius:15px;background:rgba(50,62,92,.55);font-weight:600;font-size:14px}
.wc .g{width:18px;height:18px}
.wc button{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.9);color:#4A5366;font-weight:700}
.wc span{padding-right:6px}
.w-x{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:rgba(236,229,216,.95);color:#4A5366;box-shadow:0 2px 6px rgba(40,60,100,.3)}
.w-x .g{width:18px;height:18px}
.w-bns{grid-area:bns;position:relative;display:flex;flex-direction:column;gap:10px;align-items:flex-end;padding:18px 12px 0 18px}
.wb{position:relative;flex:none;width:96px;height:54px;border-radius:8px;overflow:hidden;border:2px solid rgba(255,255,255,.55);box-shadow:0 3px 8px rgba(40,60,100,.3);transition:.25s;background:var(--bcol)}
.wb .g{position:absolute;right:-8px;bottom:-10px;width:62px;height:62px;color:rgba(255,255,255,.75)}
.wb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 15%}
.wb.on{width:118px;height:66px;border-color:#F3E3B5;box-shadow:0 0 0 2px rgba(243,227,181,.6),0 5px 14px rgba(40,60,100,.4)}
.wb.on::after{content:"";position:absolute;left:-14px;top:50%;width:8px;height:8px;rotate:45deg;background:#fff;translate:0 -50%}
.w-card{grid-area:card;position:relative;min-height:0;min-width:0;display:grid;place-items:center;padding:6px 28px 6px 8px;container-type:size}
/* o cartão é uma prancha 16:9 que escala por inteiro: todo o texto usa cqw para manter a proporção do Genshin */
.bn{position:relative;width:min(100cqw,calc(100cqh * 16 / 9));aspect-ratio:16/9;border-radius:14px;overflow:hidden;border:3px solid rgba(255,255,255,.9);box-shadow:0 14px 40px rgba(40,60,100,.35);background:linear-gradient(120deg,#5B7FBC,#B7D2F0);container-type:inline-size;animation:bnIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes bnIn{from{opacity:0;transform:translateX(30px)}}
.bn-bg{position:absolute;inset:0}.bn-bg img{width:100%;height:100%;object-fit:cover}
.bn.has-art::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(18,26,52,.38),transparent 48%);pointer-events:none}
.bn-ph{position:absolute;right:3%;bottom:0;width:56%;height:100%;display:grid;place-items:end center;color:#fff}
.bn-ph img{width:100%;height:100%;object-fit:contain;object-position:bottom center}
.bn-ph svg{width:52%;height:52%;margin-bottom:14%;opacity:.9;filter:drop-shadow(0 0 3cqw rgba(255,255,255,.7))}
.bn-txt{position:absolute;z-index:2;left:3.4cqw;top:3.2cqw;width:40cqw;display:flex;flex-direction:column;gap:1.1cqw;text-shadow:0 .15cqw .5cqw rgba(0,0,0,.45)}
.bn-tag{align-self:flex-start;margin-left:-3.4cqw;padding:.4cqw 1.8cqw .4cqw 3.4cqw;border-radius:0 1.6cqw 1.6cqw 0;background:var(--tagc);font-size:max(10px,1.55cqw);font-weight:700}
.bn-h{font:700 max(17px,3.9cqw)/1.05 var(--ft);margin:0;color:#fff;text-wrap:balance}
.bn-box{background:rgba(255,255,255,.9);color:#4A5366;border-radius:.4cqw;padding:1cqw 1.4cqw;text-shadow:none;font-size:max(10px,1.4cqw);line-height:1.35}
.bn-box b{display:block;color:#C97D3A;font-size:max(11px,1.65cqw);margin-bottom:.4cqw}
.bn-box p{margin:0;display:flex;gap:.7cqw}
.bn-box p::before{content:"";flex:none;width:.8cqw;height:.8cqw;margin-top:.55em;rotate:45deg;background:#C9A34E}
.bn-desc{font-size:max(10px,1.35cqw);line-height:1.4}
.bn-time{font-size:max(10px,1.3cqw)}
.bn-side{position:absolute;z-index:2;right:2.4cqw;top:3cqw;display:flex;flex-direction:column;gap:.8cqw}
.bn-side div{width:5.4cqw;height:5.4cqw;border-radius:50%;overflow:hidden;border:.25cqw solid #fff;background:rgba(255,255,255,.35);display:grid;place-items:center;box-shadow:0 .2cqw .6cqw rgba(0,0,0,.25)}
.bn-side img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}.bn-side .g{width:60%;height:60%}
.bn-plate{position:absolute;z-index:2;right:4cqw;bottom:5.5cqw;display:grid;justify-items:end;gap:.3cqw;text-shadow:0 .2cqw .6cqw rgba(0,0,0,.55)}

/* painel lateral (HSR) */

.lcpn{margin:0;font-size:16px}.lcpd,.lcpass p{margin:0;font-size:14px;line-height:1.5;color:var(--ink)}
.lcpd b.pv,.lcpass b.pv,.lccmp b.pv{color:var(--gold)}.lcpd b.up,.lccmp b.up{color:#7FE3A5;text-shadow:0 0 8px rgba(127,227,165,.5)}
.lcdesc{margin:0;font-size:13px;color:var(--dim);font-style:italic}

/* tela de detalhes */
.lcv{position:fixed;inset:0;z-index:26;display:grid;grid-template-columns:220px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"h h" "n m";padding:env(safe-area-inset-top,0px) max(0px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(0px,env(safe-area-inset-left,0px));
  background:radial-gradient(50% 40% at 38% 75%,rgba(255,255,255,.12),transparent 70%),radial-gradient(60% 60% at 70% 30%,rgba(81,68,119,.5),transparent 70%),linear-gradient(#070A18,#121A3C 60%,#0A0E22);overflow:hidden}

.lch{grid-area:h;display:flex;align-items:center;justify-content:space-between;padding:14px 20px}

.lcnav{grid-area:n;display:flex;flex-direction:column;gap:8px;padding:30px 0 0 26px}

.lcleft{display:grid;justify-items:center;gap:10px;align-self:center}
.lca{position:relative;width:min(100%,calc((100vh - 170px)*.75));aspect-ratio:3/4;border-radius:6px;overflow:hidden;border:3px solid color-mix(in srgb,var(--rc) 75%,#fff);box-shadow:0 0 0 6px rgba(255,255,255,.06),0 20px 60px rgba(0,0,0,.55),0 0 50px -10px var(--rc);background:#0B1024;transform:perspective(900px) rotateY(-6deg);animation:lcIn .6s cubic-bezier(.2,.8,.2,1)}
@keyframes lcIn{from{opacity:0;transform:perspective(900px) rotateY(-30deg) translateX(-30px)}}
.lca img{object-fit:contain;background:#0B1024}
.lcs{color:#FFD86E;font-size:24px;letter-spacing:2px;text-shadow:0 0 12px rgba(255,216,110,.6)}
.lcright{display:flex;flex-direction:column;gap:12px;max-width:560px;min-width:0}
.lcnm{margin:0;font:700 clamp(24px,3vw,34px)/1.1 var(--ft);text-wrap:balance}
.lcmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.elchip{display:inline-flex;align-items:center;gap:6px;padding:3px 12px 3px 6px;border-radius:14px;background:color-mix(in srgb,var(--ec) 18%,rgba(8,12,28,.7));border:1px solid color-mix(in srgb,var(--ec) 60%,transparent);color:var(--ec);font-weight:700}.elchip .g{width:18px;height:18px}
.lcline{display:grid;grid-template-columns:auto auto auto auto;justify-content:start;gap:4px 14px;align-items:baseline;color:var(--mut)}.lcline b{font-size:22px;color:var(--ink)}.lcline small{color:var(--mut);font-size:14px}
.lcsupb i{display:grid;place-items:center;width:28px;height:28px;rotate:45deg;border:1px solid rgba(227,199,138,.5);font:700 11px var(--ft);font-style:normal;color:var(--dim)}
.lcsupb i.on{background:color-mix(in srgb,var(--gold) 30%,transparent);border-color:var(--gold);color:#fff;box-shadow:0 0 10px -2px var(--gold)}
.lcsupb span{margin-left:10px}.lcsupb i b,.lcrk .rn b{rotate:-45deg;font-weight:700}
.lcstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lcsc{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--glass);border:1px solid var(--line)}
.lcsc .g{grid-row:span 2;width:22px;height:22px;color:var(--mut)}.lcsc span{font-size:12px;color:var(--mut)}.lcsc b{font-size:20px}.lcsc em{grid-column:2;font-style:normal;color:var(--ok);font-weight:700;font-size:14px}
.lcpass{padding:14px 16px;border-radius:14px;background:var(--glass);border:1px solid var(--line);display:grid;gap:8px}.lcpass h4{margin:0;font-size:17px;color:var(--gold)}
.lcstate{font-size:13px;font-weight:700;color:var(--mut)}.lcstate.on{color:var(--ok)}.lcstate.off{color:var(--bad)}
.lcbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}.lcbtns .pillb{flex:1;min-width:120px}
.lcrk{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.lcrk .rn{display:grid;place-items:center;width:46px;height:46px;rotate:45deg;border:2px solid var(--gold);font:700 16px var(--ft)}.lcrk .rn.up{background:color-mix(in srgb,var(--gold) 35%,transparent);box-shadow:0 0 16px var(--gold)}
.lcrk .arr{font-size:22px;color:var(--gold)}.lcrk small{flex-basis:100%;color:var(--mut)}
.lccmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}.lccmp>div{padding:12px;border-radius:12px;background:var(--glass);border:1px solid var(--line)}.lccmp>div:last-child{border-color:rgba(127,227,165,.5)}
.lccmp small{font-size:11px;letter-spacing:.2em;color:var(--mut)}.lccmp h4{margin:4px 0;font-size:15px}.lccmp p{margin:0;font-size:13px;line-height:1.45}
.lccopies{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.lcsel{display:grid;gap:4px;padding:3px;border-radius:10px;border:2px solid transparent;text-align:center}.lcsel.on{border-color:#7FE3A5;box-shadow:0 0 12px rgba(127,227,165,.5)}.lcsel small{font-size:11px;color:var(--mut)}
.lcsel .lcc{pointer-events:none}
.warn{margin:0;font-size:13px;color:#FFC27F;font-weight:600}
.lcpick{display:grid;gap:6px}.lcpc{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:8px;border-radius:12px;background:rgba(233,238,248,.05);border:1px solid var(--line);text-align:left}.lcpc.on{border-color:var(--ink)}
.lcpc b{display:block}.lcpc small{display:flex;align-items:center;gap:4px;color:var(--mut)}.lcpc em{font-style:normal;font-size:12px;font-weight:700}
.wslot .lct{width:64px;height:84px;border-radius:6px;flex:none;border:2px solid color-mix(in srgb,var(--rc) 70%,#fff)}
.wslot i{font-style:normal}
@media (max-width:900px){
  .lcv{grid-template-columns:1fr;grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"h" "n" "m"}

/* ======================== ADMIN ======================== */
.adm{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);gap:18px;min-height:0;padding-top:14px}
.form{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:14px;background:var(--glass);border:1px solid var(--line);margin-bottom:16px;scrollbar-width:thin}
.fld{display:grid;gap:5px}
.fld>span{font-size:12px;letter-spacing:.14em;color:var(--mut);text-transform:uppercase}
.fld input[type=text],.fld input[type=number],.fld select,.fld textarea{height:38px;border-radius:10px;background:rgba(233,238,248,.07);border:1px solid var(--line2);padding:0 12px;width:100%}
.fld textarea{height:70px;padding:8px 12px;resize:vertical;font:inherit;color:inherit}
.fld select option{background:#121a3a}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips label{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 8px;border-radius:16px;border:1px solid var(--line2);cursor:pointer;font-size:13px;font-weight:600}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label:has(input:checked){background:color-mix(in srgb,var(--ec,#E9EEF8) 30%,transparent);border-color:var(--ec,#E9EEF8)}

.chips .g{width:16px;height:16px;color:var(--ec)}
.drop{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.drop .pv{width:96px;height:96px;border-radius:12px;background:var(--bg2) center/contain no-repeat;border:1px dashed var(--line2);display:grid;place-items:center;overflow:hidden}

.drop input[type=file]{font-size:13px;max-width:100%}
.alist{min-height:0;overflow:auto;display:grid;grid-auto-rows:max-content;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-content:start;padding:0 4px 20px;scrollbar-width:thin}
.ac{display:grid;gap:6px;padding:8px;border-radius:12px;background:var(--glass);border:1px solid var(--line);text-align:left;transition:.2s}

.ac.on{border-color:var(--ink)}
.ac .ai{aspect-ratio:4/3;border-radius:8px;background:var(--bg2);overflow:hidden;display:grid;place-items:center}

.ac .ai .g{width:42%;height:42%;color:var(--mut)}
.ac b{font-size:14px}.ac small{font-size:12px;color:var(--mut)}
.lockv{display:grid;place-items:center;align-content:center;gap:12px;text-align:center;padding:40px}

/* ======================== MODAL / AVISO ======================== */

.credit{font-size:11px;color:var(--dim);text-align:center;padding:6px}
.credit a{color:var(--dim)}

@keyframes doll{0%{opacity:0;transform:scale(.5)}20%{opacity:1;transform:scale(1)}70%{transform:scale(1)}75%{transform:scale(.9)}100%{opacity:0}}
.nb-hammer .g{width:70px;height:70px;left:-35px;top:-35px;color:#ddd;animation:hammer .7s ease-in both}
@keyframes hammer{0%{transform:rotate(-70deg);opacity:0}30%{opacity:1}70%{transform:rotate(20deg)}100%{transform:rotate(10deg);opacity:0}}
.nb-spike i{width:6px;height:90px;top:-100px;background:linear-gradient(#fff,#888);clip-path:polygon(50% 100%,0 0,100% 0);transform-origin:bottom;animation:spike .8s cubic-bezier(.2,1.6,.4,1) both;animation-delay:inherit}
.nb-spike i:nth-child(1){left:-30px;--a:-20deg}.nb-spike i:nth-child(2){left:-3px;--a:0deg}.nb-spike i:nth-child(3){left:24px;--a:20deg}
@keyframes spike{0%{transform:rotate(var(--a)) scaleY(0)}40%{transform:rotate(var(--a)) scaleY(1)}80%{opacity:1}100%{opacity:0}}
/* Doflamingo */
.bind i{width:120px;height:2px;left:-60px;background:#ff8ad8;box-shadow:0 0 8px #ff4fc0;animation:slashx .8s ease-out both}.bind i:nth-child(1){--a:30deg}.bind i:nth-child(2){--a:-30deg}
.pink-dusk{background:radial-gradient(circle at 50% 40%,#ff4fc033,#3a0b3466);animation:fade2 2.1s both}
.cage{width:0;height:0;animation:cagez 2s ease-in-out both}
.cage i{position:absolute;bottom:40px;left:calc(var(--k) * var(--w) / 14 - var(--w) / 2);width:2px;height:280px;background:linear-gradient(transparent,#ff8ad8 30%,#ff8ad8);box-shadow:0 0 8px #ff4fc0;transform-origin:bottom;animation:cagel 2s ease-in-out both}
@keyframes cagel{0%{transform:translateY(-300px);opacity:0}30%{transform:none;opacity:1}85%{opacity:1}100%{opacity:0}}
@keyframes cagez{0%,50%{transform:scaleX(1)}80%{transform:scaleX(.55)}100%{transform:scaleX(.5)}}
/* Naruto */
.swirl i{width:80px;height:80px;left:-40px;top:-40px;border-radius:50%;background:conic-gradient(#ff8a00,#ffd27a,transparent,#ff8a00);animation:spin .7s linear both,boom .7s ease-out both}
@keyframes spin{to{rotate:720deg}}
.puff i{width:44px;height:44px;border-radius:50%;background:radial-gradient(#fff,#e6e6e6 50%,transparent 70%);animation:puff .7s ease-out both;animation-delay:inherit}
.puff i:nth-child(1){left:-36px;top:-20px}.puff i:nth-child(2){left:-8px;top:-34px}.puff i:nth-child(3){left:-14px;top:-6px}
.puff.gold i{background:radial-gradient(#fff,#ffe9a3 50%,transparent 70%)}
@keyframes puff{0%{transform:scale(.3);opacity:.95}100%{transform:scale(1.5);opacity:0}}
.rasen i{width:70px;height:70px;left:-35px;top:-35px;border-radius:50%;background:radial-gradient(#fff,#8fd9ff 45%,#2a8cff 70%,transparent 72%);box-shadow:0 0 30px #3fa9ff;animation:rasen .9s ease-out both;animation-delay:inherit}
.rasen i+i{background:conic-gradient(transparent,#fff 20%,transparent 40%,#bfe9ff 60%,transparent 80%);box-shadow:none;animation:rasen .9s ease-out both,spin .9s linear both;animation-delay:inherit}
@keyframes rasen{0%{transform:scale(0)}40%{transform:scale(1)}80%{transform:scale(1.05);opacity:1}100%{transform:scale(1.6);opacity:0}}
/* Bulma */
.money{background:linear-gradient(#ffd34d22,#5a3d0044);animation:fade2 2.1s both}
.money i{position:absolute;top:-30px;animation:snow var(--d) linear both}
.money i.c{color:#ffd34d;font:900 22px/1 var(--ft);text-shadow:0 0 8px #ffae00}
.money i.b{width:30px;height:14px;background:linear-gradient(90deg,#3fae5a,#7fe08f);border:1px solid #1e6b33;border-radius:2px;rotate:var(--r)}
/* Archer */
.blade-fly .g{width:46px;height:46px;left:-23px;top:-23px;color:#e6dcff;filter:drop-shadow(0 0 8px #b48cff);animation:bfly .5s cubic-bezier(.5,0,.8,.6) both}
@keyframes bfly{0%{transform:translate(0,0) rotate(45deg)}100%{transform:translate(var(--tx),var(--ty)) rotate(405deg)}}
.ubw{background:linear-gradient(#2a0a05ee,#a8441aaa 55%,#3b1206ee);animation:fade2 2.6s both}
.ubw .gear{position:absolute;left:50%;top:42%;width:320px;height:320px;margin:-160px;color:#ffb36b;opacity:.28;animation:spin 6s linear both}
.ubw .gear svg{width:100%;height:100%}
.ubw p{position:absolute;left:0;right:0;bottom:14%;text-align:center;font:italic 700 18px var(--ft);color:#ffd9b0;letter-spacing:.06em;text-shadow:0 0 12px #ff7a1a;animation:cw 2.4s both}
.sword-drop .g{width:52px;height:52px;left:-26px;top:-26px;color:#e8e8f0;filter:drop-shadow(0 0 6px #ffb36b);animation:sdrop .7s cubic-bezier(.7,0,1,.6) both}
@keyframes sdrop{0%{transform:translateY(calc(var(--h) * -1)) rotate(calc(var(--r) + 135deg));opacity:0}20%{opacity:1}70%{transform:translateY(0) rotate(calc(var(--r) + 135deg));opacity:1}100%{transform:translateY(0) rotate(calc(var(--r) + 135deg));opacity:0}}
/* Goku */
.kaioken i{width:110px;height:150px;left:-55px;top:-95px;border-radius:50% 50% 45% 45%;background:radial-gradient(ellipse at 50% 70%,#ff4d4d99,#ff000044 50%,transparent 70%);box-shadow:0 0 30px #ff2020;animation:aura 1s ease-in-out both}
@keyframes aura{0%{transform:scale(.6);opacity:0}30%{transform:scale(1.1);opacity:1}60%{transform:scale(.95)}100%{transform:scale(1.2);opacity:0}}
.kame-ball i{width:60px;height:60px;left:-30px;top:-30px;border-radius:50%;background:radial-gradient(#fff,#8fe3ff 40%,#1e7dff 70%,transparent 72%);box-shadow:0 0 30px #3fb8ff,0 0 60px #1e7dff;animation:kball 1.5s ease-in both}
.kame-ball i+i{background:none;border:2px solid #bff4ff;animation:kball 1.5s ease-in both,spin 1.5s linear both}
@keyframes kball{0%{transform:scale(.1)}60%{transform:scale(1.2)}75%{transform:scale(1.4)}100%{transform:scale(.4);opacity:0}}
/* Yoruichi */
.aura-elec i{width:130px;height:130px;left:-65px;top:-65px;border-radius:50%;border:3px solid #c38bff;box-shadow:0 0 24px #a35cff,inset 0 0 24px #fff3b0;animation:ringx 1.2s ease-out both}.aura-elec i+i{animation-delay:.25s}
.strike i{width:10px;height:700px;left:-5px;top:-700px;background:linear-gradient(transparent,#fff 30%,#e0c2ff);box-shadow:0 0 18px #a35cff,0 0 40px #7b2cff;clip-path:polygon(40% 0,60% 0,45% 30%,70% 30%,35% 65%,60% 65%,50% 100%,30% 60%,50% 60%,20% 30%,45% 30%);animation:strike .9s ease-out both;animation-delay:inherit}
@keyframes strike{0%{opacity:0}10%{opacity:1}20%{opacity:.4}30%,60%{opacity:1}100%{opacity:0}}
.roar i{width:120px;height:120px;left:-60px;top:-60px;border-radius:50%;border:4px solid #e0c2ff;box-shadow:0 0 30px #a35cff;animation:roar 1.2s ease-out both}.roar i:nth-child(2){animation-delay:.18s}.roar i:nth-child(3){animation-delay:.36s}
@keyframes roar{0%{transform:scale(.2);opacity:1}100%{transform:scale(4);opacity:0}}
/* flashes */
.flash-pink,.flash-red,.flash-blue,.flash-white,.flash-violet{animation:flash .5s ease-out both}
.flash-pink{background:#ff7ac8}.flash-red{background:#ff2a2a}.flash-blue{background:#8fdcff}.flash-white{background:#fff}.flash-violet{background:#a35cff}
@keyframes flash{0%{opacity:0}20%{opacity:.55}100%{opacity:0}}
/* DIO: o tempo para */
.tstop{backdrop-filter:grayscale(1) contrast(1.3);background:#4a3b0022;animation:fade2 .9s both}
.zw{animation:zwgray 3s both}
@keyframes zwgray{0%,30%{backdrop-filter:none;background:transparent}35%,85%{backdrop-filter:grayscale(1) contrast(1.4) brightness(.9);background:#3a2a0033}100%{backdrop-filter:none;background:transparent}}
.zw .wave{position:absolute;width:0;height:0;border-radius:50%;transform:translate(-50%,-50%);backdrop-filter:invert(1) hue-rotate(180deg);box-shadow:0 0 0 3px #ffe08a,0 0 40px #ffcc33;animation:zwave 1.1s cubic-bezier(.3,0,.4,1) both}
@keyframes zwave{0%{width:0;height:0;opacity:1}80%{opacity:1}100%{width:2600px;height:2600px;opacity:0}}
.zw .clock{position:absolute;left:50%;top:22%;width:120px;height:120px;margin-left:-60px;color:#ffd34d;filter:drop-shadow(0 0 16px #ffae00);animation:clk 3s both}
.zw .clock svg{width:100%;height:100%}
@keyframes clk{0%,30%{opacity:0;transform:scale(.4) rotate(0)}40%{opacity:1;transform:scale(1) rotate(-360deg)}80%{opacity:1;transform:rotate(-360deg)}100%{opacity:0}}
.zw .zwt{position:absolute;left:0;right:0;top:46%;text-align:center;font:900 54px/1 var(--ft);color:#ffd34d;-webkit-text-stroke:2px #5a2d00;text-shadow:0 0 30px #ffae00;animation:zwt 3s both}
.zw small{position:absolute;left:0;right:0;top:calc(46% + 62px);text-align:center;font:italic 700 16px var(--ft);color:#fff6d0;animation:zwt 3s .2s both}
@keyframes zwt{0%,25%{opacity:0;transform:scale(2)}35%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.knife .g{width:28px;height:28px;left:-14px;top:-14px;color:#e8e8f0;filter:drop-shadow(0 0 6px #ffd34d);animation:knife 1.7s both}
@keyframes knife{0%{opacity:0;transform:rotate(var(--r)) scale(.4)}20%{opacity:1;transform:rotate(var(--r)) scale(1)}70%{opacity:1;transform:rotate(var(--r))}95%{opacity:1;transform:translate(var(--tx),var(--ty)) rotate(var(--r))}100%{opacity:0;transform:translate(var(--tx),var(--ty)) rotate(var(--r))}}
/* invocação (cinemáticas) */
.sumfx{position:absolute;inset:0;z-index:6;overflow:hidden;pointer-events:none;background:#000}
.sumfx.out{animation:fadeo .4s both}@keyframes fadeo{to{opacity:0}}
.sumfx .t1{position:absolute;left:0;right:0;top:44%;text-align:center;font:900 clamp(34px,9vw,84px)/1 var(--ft);letter-spacing:.06em;color:#fff;animation:st1 4.2s both}
.sumfx .t2{position:absolute;left:0;right:0;top:calc(44% + clamp(44px,10vw,96px));text-align:center;font:700 clamp(14px,3.6vw,22px) var(--ft);letter-spacing:.3em;color:#fff;opacity:.85;animation:st1 4.2s .25s both}
@keyframes st1{0%,38%{opacity:0;transform:scale(1.8)}48%{opacity:1;transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
.su-dio{background:radial-gradient(circle at 50% 50%,#2a1a00,#000 70%)}
.su-dio .wave{position:absolute;left:50%;top:50%;width:0;height:0;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,#ffe36b00 60%,#ffe36b 62%,#2ea84f 66%,#ffe36b00 70%);animation:zwave 1.4s .9s cubic-bezier(.3,0,.4,1) both;mix-blend-mode:screen}
.su-dio .clock{position:absolute;left:50%;top:50%;width:min(60vw,360px);height:min(60vw,360px);transform:translate(-50%,-50%);color:#ffd34d;opacity:.35;filter:drop-shadow(0 0 30px #ffae00);animation:sclk 4.2s both}
.su-dio .clock svg{width:100%;height:100%}
.su-dio .clock em{position:absolute;left:50%;top:50%;width:4px;height:42%;margin-left:-2px;background:#fff3c4;transform-origin:50% 0;rotate:180deg;animation:hand 1.6s cubic-bezier(.2,.8,.2,1) both}.su-dio .clock em.m{height:30%;width:6px;animation-duration:2s}
@keyframes hand{from{rotate:900deg}to{rotate:180deg}}
@keyframes sclk{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}20%{opacity:.5}40%{opacity:.35;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}
.su-dio .gogo span{position:absolute;font:900 clamp(26px,6vw,54px)/1 system-ui,"Noto Sans JP","Hiragino Sans",sans-serif;color:#c05bff;-webkit-text-stroke:1px #2a0040;text-shadow:0 0 16px #8a2be2;left:calc(4% + (var(--i) * 11%));animation:gogo 4.2s calc(var(--i) * 90ms) both}
@keyframes gogo{0%,10%{opacity:0;transform:scale(.5)}25%{opacity:1;transform:scale(1.1)}35%{transform:scale(1)}50%{transform:translateY(-6px)}65%{transform:translateY(4px)}80%{opacity:1}100%{opacity:0}}
.su-dio .knives span{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px;color:#f0f0f0;filter:drop-shadow(0 0 8px #ffd34d);transform:rotate(calc(var(--i) * 30deg)) translateY(min(-28vw,-170px)) rotate(180deg);animation:kring 4.2s both}
.su-dio .knives span svg{width:100%;height:100%}
@keyframes kring{0%,35%{opacity:0}45%{opacity:1}75%{opacity:1;transform:rotate(calc(var(--i) * 30deg + 60deg)) translateY(min(-28vw,-170px)) rotate(180deg)}92%{opacity:1;transform:rotate(calc(var(--i) * 30deg + 60deg)) translateY(-10px) rotate(180deg)}100%{opacity:0}}
.su-dio .t1{color:#ffd34d;-webkit-text-stroke:2px #5a2d00;text-shadow:0 0 40px #ffae00}
.su-dioc{background:radial-gradient(circle,#1b1405,#000 70%)}
.su-dioc .face{position:absolute;left:50%;top:46%;width:min(70vw,380px);height:min(70vw,380px);transform:translate(-50%,-50%);border-radius:50%;border:4px solid #ffd34d;box-shadow:0 0 50px #ffae0088,inset 0 0 50px #ffae0044;animation:sface 3.4s both}
.su-dioc .face i{position:absolute;left:50%;top:50%;width:4px;height:18px;margin:-9px -2px;background:#ffe9a3;transform:rotate(calc(var(--i) * 30deg)) translateY(calc(min(35vw,190px) * -1 + 20px))}
.su-dioc .face em{position:absolute;left:50%;top:50%;width:6px;height:40%;margin-left:-3px;background:#fff;transform-origin:50% 0;rotate:180deg;animation:hand 2.2s cubic-bezier(.1,.9,.2,1) both}.su-dioc .face em.m{height:28%;width:9px;animation-duration:2.6s}
@keyframes sface{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}90%{opacity:1;filter:brightness(3)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.4)}}
.su-dioc .gears span{position:absolute;color:#b8860b;opacity:.5;animation:spin 3.4s linear both}.su-dioc .gears span svg{width:100%;height:100%}
.su-dioc .gears span:nth-child(1){left:6%;top:10%;width:30vw;height:30vw;max-width:200px;max-height:200px}.su-dioc .gears span:nth-child(2){right:8%;bottom:12%;width:22vw;height:22vw;max-width:150px;max-height:150px;animation-direction:reverse}.su-dioc .gears span:nth-child(3){right:20%;top:8%;width:14vw;height:14vw;max-width:90px;max-height:90px}
.su-dioc .t1{top:auto;bottom:12%;font-size:clamp(22px,6vw,48px);color:#ffd34d;animation:st1 3.4s both}
.su-yoru{background:#000}
.su-yoru .eyes{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);display:flex;gap:min(14vw,90px)}
.su-yoru .eyes i{width:min(12vw,70px);height:min(5vw,30px);background:radial-gradient(ellipse,#fff7a8,#ffd000 50%,#a36b00);border-radius:50%/50%;clip-path:ellipse(50% 40% at 50% 50%);box-shadow:0 0 30px #ffd000;animation:eyes 4.2s both}
.su-yoru .eyes i::after{content:"";position:absolute}
@keyframes eyes{0%,8%{transform:scaleY(0)}14%{transform:scaleY(1)}22%{transform:scaleY(.1)}26%,38%{transform:scaleY(1)}44%{opacity:1}52%{opacity:0}100%{opacity:0}}
.su-yoru .split{position:absolute;left:-10%;top:50%;width:120%;height:6px;background:#fff;box-shadow:0 0 30px #c38bff,0 0 80px #7b2cff;transform:rotate(-24deg) scaleX(0);animation:split 4.2s both}
@keyframes split{0%,38%{transform:rotate(-24deg) scaleX(0);opacity:1}44%{transform:rotate(-24deg) scaleX(1)}55%{opacity:1}70%{opacity:0;transform:rotate(-24deg) scaleX(1) scaleY(20)}100%{opacity:0}}
.su-yoru .arcs i{position:absolute;left:calc(8% + var(--i) * 11%);width:6px;height:min(30vh,200px);background:linear-gradient(#fff,#c38bff);box-shadow:0 0 18px #a35cff;clip-path:polygon(40% 0,60% 0,45% 30%,70% 30%,35% 65%,60% 65%,50% 100%,30% 60%,50% 60%,20% 30%,45% 30%);rotate:calc(var(--i) * 40deg);animation:arc 4.2s calc(var(--i) * 60ms) both}
@keyframes arc{0%,42%{opacity:0}46%{opacity:1}50%{opacity:.2}54%{opacity:1}70%{opacity:.6}85%{opacity:1}100%{opacity:0}}
.su-yoru .cat{position:absolute;left:50%;top:44%;width:min(60vw,320px);height:min(60vw,320px);transform:translate(-50%,-50%);color:#7b2cff;filter:drop-shadow(0 0 30px #a35cff);opacity:0;animation:scat 4.2s both}
.su-yoru .cat svg{width:100%;height:100%}
@keyframes scat{0%,48%{opacity:0;transform:translate(-50%,-50%) scale(.6)}58%{opacity:.6;transform:translate(-50%,-50%) scale(1)}85%{opacity:.4}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}
.su-yoru .t1{color:#f3e6ff;text-shadow:0 0 30px #a35cff,0 0 6px #fff;letter-spacing:.3em}
.su-yoruc{background:radial-gradient(circle,#1a0830,#000 70%)}
.su-yoruc .tears i{position:absolute;left:50%;top:46%;width:130vw;height:10px;margin-left:-65vw;background:linear-gradient(90deg,transparent,#fff6b0,#b57bff,transparent);box-shadow:0 0 30px #a35cff;transform:rotate(-30deg) scaleX(0);animation:tear 3.4s both}
.su-yoruc .tears i:nth-child(1){margin-top:-60px;animation-delay:.2s}.su-yoruc .tears i:nth-child(2){animation-delay:.45s}.su-yoruc .tears i:nth-child(3){margin-top:60px;animation-delay:.7s}
@keyframes tear{0%{transform:rotate(-30deg) scaleX(0)}12%{transform:rotate(-30deg) scaleX(1)}70%{opacity:1}100%{opacity:0;transform:rotate(-30deg) scaleX(1)}}
.su-yoruc .paw{position:absolute;left:50%;top:46%;width:min(40vw,200px);height:min(40vw,200px);transform:translate(-50%,-50%);color:#c38bff;filter:drop-shadow(0 0 30px #7b2cff);animation:scat 3.4s both}
.su-yoruc .paw svg{width:100%;height:100%}
.su-yoruc .t1{top:auto;bottom:14%;font-size:clamp(20px,5.5vw,44px);color:#f3e6ff;text-shadow:0 0 24px #a35cff;animation:st1 3.4s both}
.rev.sig.su-dio .rart img,.rev.sig.su-dioc .rart img{filter:drop-shadow(0 0 40px #ffcc33) drop-shadow(0 0 10px #fff)}
.rev.sig.su-yoru .rart img,.rev.sig.su-yoruc .rart img{filter:drop-shadow(0 0 40px #a35cff) drop-shadow(0 0 10px #fff)}
.rev.sig::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 45%,var(--sg,#ffcc3333),transparent 60%);animation:fade2 3s both}
.rev.sig.su-yoru,.rev.sig.su-yoruc{--sg:#a35cff44}

.trinfo .ok{color:#7BE3A6;display:flex;gap:6px;align-items:center}.trinfo .ok .g{width:16px;height:16px}
/* ajuda "?", Eidolons, imagens de relíquias */
.lvrow{display:flex;gap:6px;align-items:stretch}.lvrow .pillb.wide{flex:1}
.qbtn{display:inline-grid;place-items:center;min-width:34px;min-height:34px;padding:2px 8px;border-radius:17px;border:1px solid color-mix(in srgb,var(--gold) 60%,transparent);background:rgba(255,255,255,.05);color:var(--gold);font-weight:800;line-height:1;cursor:pointer}
.qbtn small{font-size:9.5px;font-weight:600;color:var(--mut)}.qbtn:hover{background:rgba(255,255,255,.1)}

<script>
"use strict";
/* =====================================================================
   ASTRALIS · NÚCLEO DO JOGO (sem DOM)
   Dados, fórmulas, gacha, níveis, masmorras, torre e motor de combate.
   Fórmulas de combate seguem o Honkai: Star Rail (prydwen.gg / wiki):
   DEF mult = 1 - DEF/(DEF + 200 + 10*nívelAtacante); DEF inimigo = 200 + 10*nível;
   RES base 20% (0% se fraco); dano -10% enquanto a resistência não quebrou;
   quebra atrasa a ação em 25% e usa o multiplicador de nível oficial.
   ===================================================================== */

/* ---------- utilidades ---------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rint = (a, b, r = Math.random) => a + Math.floor(r() * (b - a + 1));
const pick = (arr, r = Math.random) => arr[Math.floor(r() * arr.length)];
function mulberry(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function wpick(weights, r = Math.random) {
  let total = 0;
  for (const k in weights) total += weights[k];
  let x = r() * total;
  for (const k in weights) { x -= weights[k]; if (x < 0) return k; }
  return Object.keys(weights)[0];
}
const dayKey = (t = Date.now()) => { const d = new Date(t); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); };

/* ---------- elementos ---------- */
/* 7 elementos com os efeitos de quebra do HSR (Físico, Fogo, Gelo, Raio, Vento, Quântico→Luz, Imaginário→Trevas).
   brk = multiplicador base do dano de quebra (2 / 2 / 1 / 1 / 1,5 / 0,5 / 0,5). */
const EL = {
  phy:  { n: "Físico", w: "Aço",      art: "do", c: "#D6DCE8", ic: "mailed-fist",       brk: 2,   dbf: "Sangramento" },
  fire: { n: "Fogo",   w: "Brasa",    art: "da", c: "#FF7B47", ic: "fire-ring",         brk: 2,   dbf: "Queimadura" },
  ice:  { n: "Gelo",   w: "Geada",    art: "da", c: "#73D4FF", ic: "snowflake-2",       brk: 1,   dbf: "Congelamento" },
  thd:  { n: "Raio",   w: "Trovão",   art: "do", c: "#B98CFF", ic: "focused-lightning", brk: 1,   dbf: "Choque" },
  wnd:  { n: "Vento",  w: "Vendaval", art: "do", c: "#5FE0B0", ic: "whirlwind",         brk: 1.5, dbf: "Cisalhamento" },
  lgt:  { n: "Luz",    w: "Aurora",   art: "da", c: "#FFD86E", ic: "sun",               brk: 0.5, dbf: "Emaranhamento" },
  drk:  { n: "Trevas", w: "Eclipse",  art: "do", c: "#E35D8C", ic: "evil-moon",         brk: 0.5, dbf: "Aprisionamento" },

};
const ELS = Object.keys(EL);

/* ---------- estilos de combate (definem o kit de habilidades; a afinidade dos Cones é o elemento) ---------- */
/* Energia (como no HSR): Básico 20, Perícia 30, Suprema 5 depois de usada, derrotar inimigo 10,
   ser atacado 10 (alvo principal da ação inimiga; demais alvos da mesma ação 5; uma vez por ação),
   Ataque Extra 10 (o kit pode mudar). Todas multiplicadas pela Regen. de Energia (base 100%).
   Começa a batalha com 50% e não passa do máximo. Ganhos "fixos" de Talentos, Eidolons e Cones ignoram a Regen. */
const EN = { b: 20, s: 30, u: 5, kill: 10, hit: 10, hit2: 5, fua: 10, start: 0.5 };
const EN_MAX = [90, 100, 110, 120, 130, 140, 160, 180];

  pre: { n: "Guardião", ic: "bordered-shield", aggro: 150, base: { hp: 190, atk: 64, def: 89, spd: 97 } },
  abu: { n: "Curandeiro",  ic: "caduceus",        aggro: 100, base: { hp: 168, atk: 70, def: 60, spd: 104 } }
};

/* ---------- atributos ---------- */
const L = {
  hp: "HP", atk: "ATK", def: "DEF", spd: "Velocidade", cr: "Taxa crítica", cd: "Dano crítico",
  ehr: "Acerto de efeito", eres: "Resistência a efeito", be: "Efeito de quebra", heal: "Bônus de cura",

};

};

const fmtN = n => Math.round(n).toLocaleString("pt-BR");

/* ---------- raridade ---------- */
const RC = { 2: "#7FB08A", 3: "#6FA8DC", 4: "#A77BE8", 5: "#E3B05A" };

/* ---------- materiais ---------- */
const MATS = {
  cx1: { n: "Anotação de Viagem",    r: 2, ic: "book-cover",     xp: 1000,  d: "EXP de personagem." },
  cx2: { n: "Crônica de Aventura",   r: 3, ic: "spell-book",     xp: 5000,  d: "EXP de personagem." },
  cx3: { n: "Compêndio do Viajante", r: 4, ic: "book-aura",      xp: 20000, d: "EXP de personagem." },
  wx1: { n: "Éter Esparso",          r: 2, ic: "fluffy-swirl",   xp: 500,   d: "EXP de arma." },
  wx2: { n: "Éter Condensado",       r: 3, ic: "magic-swirl",    xp: 2000,  d: "EXP de arma." },
  wx3: { n: "Éter Refinado",         r: 4, ic: "rolling-energy", xp: 6000,  d: "EXP de arma." },
  rx1: { n: "Pó Relicário",          r: 2, ic: "sparkles",       xp: 100,   d: "EXP de relíquia." },
  rx2: { n: "Fragmento Dourado",     r: 3, ic: "gems",           xp: 500,   d: "EXP de relíquia." },
  rx3: { n: "Cristal Relicário",     r: 4, ic: "floating-crystal", xp: 1000, d: "EXP de relíquia." }
};
const TIER_C = [["Lasca", "crystalize"], ["Cristal", "crystal-shine"], ["Núcleo", "crystal-growth"]];
const TIER_W = [["Minério", "ore"], ["Lingote", "crystal-bars"], ["Coração Forjado", "anvil-impact"]];
for (const e of ELS) for (let t = 1; t <= 3; t++) {
  MATS["c" + e + t] = { n: TIER_C[t - 1][0] + " de " + EL[e].w, r: t + 1, ic: TIER_C[t - 1][1], el: e, d: "Ascensão de personagens de " + EL[e].n + "." };
  MATS["w" + e + t] = { n: TIER_W[t - 1][0] + " de " + EL[e].w, r: t + 1, ic: TIER_W[t - 1][1], el: e, d: "Ascensão de Cones de Luz de " + EL[e].n + "." };
}
/* materiais de Rastro e Insígnias: itens reais do inventário (ID, raridade, ícone, descrição e origem) */
Object.assign(MATS, {
  tf1: { n: "Fragmento de Rastro", r: 2, ic: "rune-stone", d: "Aprimora habilidades e desbloqueia Rastros (níveis iniciais).", src: "Câmara dos Rastros (estágio I+)" },
  tf2: { n: "Núcleo de Rastro", r: 3, ic: "stone-tablet", d: "Aprimoramentos intermediários de habilidades e Rastros.", src: "Câmara dos Rastros (estágio II+) · síntese de 3 Fragmentos" },
  tf3: { n: "Essência de Rastro", r: 4, ic: "crystal-ball", d: "Aprimoramentos avançados de habilidades e Rastros.", src: "Câmara dos Rastros (estágio III+) · síntese de 3 Núcleos" },
  in1: { n: "Insígnia Desgastada", r: 2, ic: "rank-1", d: "Arrancada de inimigos. Aprimoramentos iniciais.", src: "Campo de Treinamento I–V · primeira vitória nos andares 1–39 da Torre" },
  in2: { n: "Insígnia Polida", r: 3, ic: "rank-2", d: "Insígnia de inimigos mais fortes. Aprimoramentos intermediários.", src: "Campo de Treinamento II–VII · andares 40–89 da Torre · síntese de 3 Desgastadas" },
  in3: { n: "Insígnia de Elite", r: 4, ic: "rank-3", d: "Insígnia de elites. Aprimoramentos avançados e Rastros maiores.", src: "Campo de Treinamento III–VII · andares 90+ da Torre · síntese de 3 Polidas" },
  bmem: { n: "Memória de Chefe", r: 4, ic: "laurel-crown", d: "Lembrança de um chefe derrotado. Níveis altos de habilidade e Rastros maiores.", src: "Primeira vitória sobre chefes e mini-chefes da Torre · Loja (limite mensal)" },
  dest: { n: "Destino de Rastro", r: 5, ic: "sundial", d: "Material raro para o nível 10 das habilidades e para A4/A6.", src: "Primeira vitória sobre chefes da Torre · Loja (limite mensal)" }
});
/* síntese 3 → 1 */
const SYNTH = { in1: "in2", in2: "in3", tf1: "tf2", tf2: "tf3" };
function synth(S, from, n) {
  const to = SYNTH[from]; n = Math.floor(n);
  if (!to || n < 1) return { err: "Este item não pode ser sintetizado." };
  if (have(S, from) < 3 * n) return { err: "Faltam " + (3 * n - have(S, from)) + " " + MATS[from].n + "." };
  S.mats[from] -= 3 * n; S.mats[to] = (S.mats[to] || 0) + n;
  return { ok: true, to, n };
}
const XPF = {
  c: [["cx3", 20000], ["cx2", 5000], ["cx1", 1000]],
  w: [["wx3", 6000], ["wx2", 2000], ["wx1", 500]],
  r: [["rx3", 1000], ["rx2", 500], ["rx1", 100]]
};

/* ---------- moedas ---------- */
const CUR = {
  ast: { n: "Astrita", ic: "cut-diamond", c: "#9FE3FF" },
  pE:  { n: "Passe Entrelaçado", ic: "ticket", c: "#F59BD0" },
  pC:  { n: "Passe Comum", ic: "ticket", c: "#8EC8FF" },
  cr:  { n: "Créditos", ic: "coins", c: "#F2D492" },
  dust:{ n: "Poeira Estelar", ic: "falling-star", c: "#B6C6F0" },
  glit:{ n: "Brilho Estelar", ic: "polar-star", c: "#F2D492" }
};

/* =====================================================================
   NÍVEIS E ASCENSÃO
   Tetos: 1→20 só EXP; ascensões em 20, 40, 50, 60 e 70; máximo 80.
   EXP total 1→80 ≈ 2,09 mi (≈105 Compêndios, perto dos ~109 Traveler's Guide do HSR).
   ===================================================================== */
const CAPS = [20, 40, 50, 60, 70, 80];
const cNeed = lv => 10 * Math.round((10 * lv * lv + 120 * lv + 500) / 10);
const WF = { 3: 0.5, 4: 0.75, 5: 1 };
const wNeed = (lv, r) => 10 * Math.round(cNeed(lv) * WF[r] / 10);
const RLF = { 2: 0.25, 3: 0.42, 4: 0.66, 5: 1 };
const rNeed = (lv, r) => 10 * Math.round((300 + 300 * lv + 90 * lv * lv) * RLF[r] / 10);
const RMAX = { 2: 6, 3: 9, 4: 12, 5: 15 };
/* ascensão: [ [tier, qtd], ... ] e créditos (valores do HSR 5★: 4k, 8k, 16k, 40k, 80k, 160k condensados em 5 fases) */
const ASC = [
  { m: [[1, 5]], cr: 4000 },
  { m: [[1, 10], [2, 3]], cr: 16000 },
  { m: [[2, 9]], cr: 40000 },
  { m: [[2, 6], [3, 6]], cr: 80000 },
  { m: [[3, 9]], cr: 160000 }
];
/* ascensão de personagem depende do maior andar vencido da Torre (como o Nível de Desbravamento do HSR) */
const ASC_TOWER = [0, 10, 25, 45, 65, 85];
const ascGate = (S, asc) => ASC_TOWER[asc + 1] || 0;
function ascCost(kind, el, asc, r) {
  const a = ASC[asc]; if (!a) return null;
  const f = kind === "c" ? (r === 4 ? 0.8 : 1) : WF[r];
  return { cr: Math.round(a.cr * f), m: a.m.map(([t, q]) => [kind + el + t, Math.max(1, Math.ceil(q * (kind === "c" ? 1 : f)))]) };
}
function needToCap(o, need) { let t = -o.xp; for (let l = o.lv; l < CAPS[o.asc]; l++) t += need(l); return Math.max(0, t); }
/* aplica EXP até o teto da fase; devolve o excedente */
function addXp(o, amt, need, cap, onLevel) {
  o.xp += amt;
  while (o.lv < cap && o.xp >= need(o.lv)) { o.xp -= need(o.lv); o.lv++; if (onLevel) onLevel(o.lv); }
  if (o.lv >= cap) { const left = o.xp; o.xp = 0; return left; }
  return 0;
}
/* simula o nível final sem alterar o objeto */
function previewXp(o, amt, need, cap) { const c = { lv: o.lv, xp: o.xp }; addXp(c, amt, need, cap); return c; }
/* escolha automática de itens de EXP (estilo HSR: maiores sem passar, depois completa com o menor) */
function autoXp(fam, needXp, mats) {
  const sel = {}; let rem = needXp;
  for (const [id, v] of XPF[fam]) { const q = Math.min(mats[id] || 0, Math.floor(rem / v)); if (q > 0) { sel[id] = q; rem -= q * v; } }
  if (rem > 0) for (const [id, v] of [...XPF[fam]].reverse()) { if ((mats[id] || 0) > (sel[id] || 0)) { sel[id] = (sel[id] || 0) + 1; rem -= v; break; } }
  return sel;
}
const selXp = (fam, sel) => XPF[fam].reduce((a, [id, v]) => a + (sel[id] || 0) * v, 0);
/* EXP em itens (descarte e devolução); arredonda para cima no menor item */
function decompose(fam, xp) {
  const out = {}; let rem = xp;
  for (const [id, v] of XPF[fam]) { const q = Math.floor(rem / v); if (q) { out[id] = q; rem -= q * v; } }
  if (rem > 0) { const s = XPF[fam][XPF[fam].length - 1][0]; out[s] = (out[s] || 0) + 1; }
  return out;
}
function investedXp(o, need) { let t = o.xp; for (let l = 1; l < o.lv; l++) t += need(l); return t; }

/* crescimento de atributos base (HSR: +5% do base por nível e ~+48% por fase de ascensão; 80/5 ≈ 7,35x) */
const grow = (lv, asc) => 1 + 0.05 * (lv - 1) + 0.48 * asc;
const GMAX = grow(80, 5);

/* =====================================================================
   ARMAS
   3★: geradas ao acaso, elemento aleatório, sem passiva; ATK e DEF base
   máximos entre 90 e 200 no nível 80.
   ===================================================================== */
const WCAP = 300, RCAP = 500;
const WKIND = [
  ["katana", "Lâmina"], ["spear-hook", "Lança"], ["bow-arrow", "Arco"], ["crystal-wand", "Varinha"],
  ["battle-axe", "Machado"], ["scythe", "Foice"], ["plain-dagger", "Adaga"], ["warhammer", "Martelo"],
  ["spell-book", "Grimório"], ["halberd", "Alabarda"], ["wizard-staff", "Cajado"]
];
const WEPI = {
  phy:  ["de Aço", "do Gladiador", "Inquebrável", "da Forja Antiga"],
  wnd:  ["do Vendaval", "dos Ventos Uivantes", "Celeste", "da Brisa Cortante"],
  fire: ["da Brasa", "da Fornalha", "Carmesim", "do Fogo Antigo"],
  thd:  ["do Trovão", "da Tempestade", "Fulminante", "do Relâmpago"],
  ice:  ["da Geada", "do Inverno Eterno", "Boreal", "do Gelo Fino"],
  lgt:  ["da Aurora", "do Zênite", "Solar", "do Alvorecer"],
  rea:  ["da Realidade", "do Espelho Partido", "Paradoxal", "do Outro Lado"],
  drk:  ["do Eclipse", "da Noite Sem Fim", "Umbral", "do Vazio"]
};
const WDEF = { 4: { hp: 953, atk: 476, def: 330 }, 5: { hp: 1058, atk: 582, def: 463 } }; /* padrão no Nv. 80 para Cones do Admin */
function gen3Weapon(r = Math.random) {
  const el = pick(ELS, r), k = Math.floor(r() * WKIND.length);
  return { el, k, nm: WKIND[k][1] + " " + pick(WEPI[el], r), atk: rint(90, 200, r), def: rint(90, 200, r), hp: rint(160, 320, r) };
}
/* dados de um Cone no inventário: 3★ gerado, um dos 10 da coleção ou criado no Admin */
function wInfo(w, CAT) {
  const b80 = v => [v / LC_RATIO, v];
  if (w.g) {
    const g = w.g, hp = g.hp || 160 + (w.u * 37) % 160; /* legado: Cones 3★ sorteados (o save novo converte para os 12 Cones 3★) */
    return { id: null, nm: g.nm, el: g.el, ic: WKIND[g.k][0], base: { hp: b80(hp), atk: b80(g.atk), def: b80(g.def) }, pn: "", pd: "", rk: null, stat: null, art: "", icon: "", desc: "Cone 3★ forjado ao acaso. Não tem passiva." };
  }
  const B = LC_BUILTIN[w.c];
  if (B) { const d = CAT.wpns[w.c] || {}; return { ...B, ic: "spell-book", art: d.art || "", icon: d.icon || "" }; }
  const c = CAT.wpns[w.c] || { nm: "Cone removido", el: "fire" }, D = WDEF[w.r] || WDEF[4], P = adminConePassive(c) || {};
  return { id: w.c, nm: c.nm, el: c.el || "fire", ic: c.ic || "spell-book", base: { hp: b80(+c.hp || D.hp), atk: b80(+c.atk || D.atk), def: b80(+c.def || D.def) },
    pn: c.pn || "", pd: P.pd || "", rk: P.rk || null, stat: P.stat || null, art: c.art || c.spr || "", icon: c.icon || c.spr || "", desc: c.desc || "" };
}
/* atributos-base no nível/ascensão (padrão: os do próprio Cone). A Sobreposição não entra aqui. */
function wStats(w, CAT, lv = w.lv, asc = w.asc) {
  const i = wInfo(w, CAT), o = {};
  for (const k of ["hp", "atk", "def"]) o[k] = lcCurve(i.base[k][0], i.base[k][1], lv, asc);
  return o;
}
/* Sobreposição: consome uma cópia idêntica (mesmo ID). Ranks somam; o excedente acima de S5 vira Brilho Estelar. */
function lcSuperimpose(S, mainU, matU) {

/* valores da passiva no rank (1..5) */
function lcRank(i, ref) { const o = {}; for (const k in i.rk || {}) o[k] = i.rk[k][Math.min(LC_MAX_REF, Math.max(1, ref)) - 1]; return o; }
/* texto da passiva com os valores do rank; "hl" destaca em HTML os valores que mudam em relação a outro rank */
function lcText(i, ref, hl, cmp) {
  if (!i.pd) return "";
  const R = lcRank(i, ref), C = cmp ? lcRank(i, cmp) : null;
  return i.pd.replace(/\{(\w+)\}/g, (_, k) => {
    const v = (Math.round(R[k] * 10) / 10).toLocaleString("pt-BR");
    if (!hl) return v;
    const up = C && C[k] !== R[k];
    return `<b class="${up ? "up" : "pv"}">${v}</b>`;
  });
}
/* todos os Cones cadastráveis (os 22 da coleção + os criados no Admin) */
function allCones(CAT) {
  const out = [];
  for (const id in LC_BUILTIN) { const d = CAT.wpns[id] || {}; out.push({ ...LC_BUILTIN[id], art: d.art || "", icon: d.icon || "" }); }
  for (const x of Object.values(CAT.wpns)) if (!LC_BUILTIN[x.id] && !x.builtin && x.nm) out.push(x);
  return out;
}
/* passiva de Cone criado no Admin: atributo fixo com tabela S1–S5 própria (pr) */
function adminConePassive(c) {
  if (!c.pk) return null;
  const pr = Array.isArray(c.pr) && c.pr.length === 5 ? c.pr.map(Number) : [1, 1.25, 1.5, 1.75, 2].map(f => Math.round((+c.pv || 0) * f * 10) / 10);
  const lbl = L[c.pk] || c.pk;
  return { pd: (c.pdesc ? c.pdesc + " " : "") + "Aumenta " + lbl + " do portador em {a}%.", rk: { a: pr }, stat: R => ({ [c.pk]: R.a }) };
}

   em andares aleatórios (sempre nos múltiplos de 5); andares 10 e 20 têm um mini-chefe */
function towerPlan(f, CAT) {
  const r = mulberry(f * 7919 + 13), mins = towerFoes(CAT, "minion", f), els = towerFoes(CAT, "elite", f);
  if (!mins.length) return null;
  const m = () => ({ role: "minion", foe: pick(mins, r) });
  let nW = 1;
  if (f >= 4 && r() < Math.min(0.8, 0.3 + f / 100)) nW++;
  if (f >= 35 && r() < Math.min(0.55, f / 200)) nW++;
  const maxN = f < 10 ? 3 : f < 40 ? 4 : 5, waves = [];
  for (let w = 0; w < nW; w++) waves.push(Array.from({ length: rint(2, maxN, r) }, m));
  const last = waves[nW - 1];

  if (ne && f >= 60 && r() < 0.3) ne = 2;
  const mini = f === 10 || f === 20;
  if (ne === 2 && last.length > 4) last.length = 4;
  /* acima do andar 80 o nível do inimigo continua subindo (até 90) e o do jogador para em 80: o dano é suavizado */
  const atkM = f > 80 ? 1 - 0.2 * (f - 80) / 50 : 1;
  /* andares com muitos inimigos têm inimigos individualmente mais fracos; cada elite tem um fator calibrado por simulação */
  const enc = () => { const nrm = clamp(Math.sqrt(7 / waves.flat().length), 0.8, 1) * (FLOOR_K[f] || 1) * (f <= 10 ? EARLY_K : 1) * BAND_K[Math.min(3, Math.floor((f - 1) / 30))]; for (const w of waves) for (const sp of w) { const E = TOWER_ENC[sp.role], k = (ELITE_K[sp.foe.id] || 1) * nrm * towerK(f); sp.hpM = E.hp * k; sp.atkM = E.atk * atkM * k; } };
  if (els.length && mini) { last.length = Math.min(last.length, 2); last.splice(1, 0, { role: "mini", foe: pick(els, r) }); }

  enc();
  return { f, lv: floorLv(f), waves, boss: mini, mode: "tower" };
}

    const kit = c.kit ? "kit próprio" : "kit do estilo " + ((PATHS[c.path] || PATHS.des).n);
    add("ok", c.nm + ": " + kit + ", níveis de habilidade, " + traceNodes(c).length + " Rastros menores.");
    if (!c.traces) add("warn", c.nm + ": sem Rastros maiores (A2/A4/A6) cadastrados.");
    if (c.kit && !c.kit.t) add("warn", c.nm + ": sem Talento cadastrado.");
    else if (c.kit && c.kit.t) add("ok", c.nm + ": Talento " + c.kit.t.nm + " (Nv. 1–" + talentAt(c.kit.t, 1).max + ").");
    eidOf(c).forEach((e, i) => { if (e.todo) add("todo", c.nm + " E" + (i + 1) + ": efeito não cadastrado (só texto)."); else if (!(e.st || e.lv || e.fx || e.cond || e.um || e.eng)) add("todo", c.nm + " E" + (i + 1) + ": sem efeito estruturado."); });
    if (!EL[c.el]) add("warn", c.nm + ": elemento inválido (" + c.el + ").");
  }
  for (const x of allCones(CAT)) {
    const P = LC_BUILTIN[x.id] ? LC_BUILTIN[x.id] : adminConePassive(x);
    const hook = !!LC_HOOKS[x.id], stat = !!(P && P.stat && Object.keys(P.stat(lcRank(P, 1))).length);

    if (x.pdesc && !LC_BUILTIN[x.id]) add("warn", "Cone " + x.nm + ": o texto extra da passiva é só descrição.");
  }
  for (const k in SETS) if (!SETS[k].b2.length && !SETS[k].b4.length) add("warn", "Conjunto " + SETS[k].nm + ": bônus de 2/4 peças ainda não definidos.");

/* no Firebase as imagens ficam dentro do documento (limite de 1 MiB): reduz e converte para WebP */
async function toDataUrl(file, max) {
  const bmp = await createImageBitmap(file), k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
  cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
  let q = 0.9, url = cv.toDataURL("image/webp", q);
  while (url.length > 850000 && q > 0.35) { q -= 0.15; url = cv.toDataURL("image/webp", q); }
  if (url.length > 950000) throw new Error("imagem grande demais; use uma menor");
  return url;
}

/* ---------- equipar ---------- */
function equipWeapon(cid, wu) {
  const o = S.chars[cid], w = S.wpns.find(x => x.u === wu);
  if (!o || !w) return;
  const prevOwner = w.eq, old = o.w && S.wpns.find(x => x.u === o.w);
  if (old) { old.eq = prevOwner || null; if (prevOwner && S.chars[prevOwner]) S.chars[prevOwner].w = old.u; }
  else if (prevOwner && S.chars[prevOwner]) S.chars[prevOwner].w = null;
  const before = charStats(S, CAT, cid);
  w.eq = cid; o.w = w.u;
  diffToast(before, charStats(S, CAT, cid));
  save(); rerender();
}
function equipRelic(cid, ru) {
  const o = S.chars[cid], R = S.rels.find(x => x.u === ru);
  if (!o || !R) return;
  const prev = R.eq, oldU = o.rel[R.slot], old = oldU && S.rels.find(x => x.u === oldU);
  if (prev && S.chars[prev]) S.chars[prev].rel[R.slot] = old ? old.u : null;
  if (old) old.eq = prev || null;
  const before = charStats(S, CAT, cid);
  R.eq = cid; o.rel[R.slot] = R.u;
  diffToast(before, charStats(S, CAT, cid));
  save(); rerender();
}

/* ---------- subir de nível (personagem, arma, relíquia) ---------- */
function lvTarget(kind, ref) {
  if (kind === "c") { const o = S.chars[ref]; return { o, need: l => cNeed(l), cap: CAPS[o.asc], fam: "c", nm: CAT.chars[ref].nm }; }
  if (kind === "w") { const w = S.wpns.find(x => x.u === ref); return { o: w, need: l => wNeed(l, w.r), cap: CAPS[w.asc], fam: "w", nm: wInfo(w, CAT).nm }; }
  const R = S.rels.find(x => x.u === ref); return { o: R, need: l => rNeed(l, R.r), cap: RMAX[R.r], fam: "r", nm: (SETS[R.set] || {}).nm + " · " + SL[R.slot][0], rel: true };
}
function openLevel(kind, ref) {
  const T = lvTarget(kind, ref);
  const needXp = T.rel ? (() => { let t = -T.o.xp; for (let l = T.o.lv; l < T.cap; l++) t += T.need(l); return Math.max(0, t); })() : needToCap(T.o, T.need);
  let sel = autoXp(T.fam, needXp, S.mats);
  const draw = () => {
    const xp = selXp(T.fam, sel), pv = previewXp(T.o, xp, T.need, T.cap), cost = Math.round(xp * 0.1);
    $("#mbox").querySelector(".lvbody").innerHTML = `
      <div class="lvp"><span>Nv.</span><b>${T.o.lv}</b><span>→</span><b class="to">${pv.lv}</b><span>/ ${T.cap}</span></div>
      <div class="bar"><i style="width:${pv.lv >= T.cap ? 100 : pv.xp / T.need(pv.lv) * 100}%"></i></div>
      <div class="xpi">${XPF[T.fam].slice().reverse().map(([id, v]) => `<div>${matIco(id, S.mats[id] || 0)}<small class="note">${fmtN(v)} EXP</small><span class="ctl"><button data-m="dec" data-v="${id}" aria-label="Menos">−</button><b>${sel[id] || 0}</b><button data-m="inc" data-v="${id}" aria-label="Mais">+</button></span></div>`).join("")}</div>
      <div class="note">EXP selecionada: <b class="tab">${fmtN(xp)}</b> · faltam ${fmtN(needXp)} para o teto · Custo: <b style="color:${S.cr >= cost ? "var(--gold)" : "var(--bad)"}">${fmtN(cost)} créditos</b></div>`;
  };
  modal(`<h3>Subir de nível</h3><div class="note">${esc(T.nm)}</div><div class="lvbody"></div>
    <div class="macts"><button class="pillb dk" data-m="auto">Auto</button><button class="pillb dk" data-m="clear">Limpar</button><button class="pillb gold" data-m="ok">Confirmar</button></div>`, {
    on: (a, b) => {
      const id = b.dataset.v;
      if (a === "inc" && (sel[id] || 0) < (S.mats[id] || 0)) sel[id] = (sel[id] || 0) + 1;
      if (a === "dec" && sel[id]) sel[id]--;
      if (a === "auto") sel = autoXp(T.fam, needXp, S.mats);
      if (a === "clear") sel = {};
      if (a === "ok") {
        const xp = selXp(T.fam, sel), cost = Math.round(xp * 0.1);
        if (!xp) return toast("Selecione itens de EXP.");
        if (S.cr < cost) return toast("Créditos insuficientes.");
        for (const k in sel) S.mats[k] -= sel[k];
        S.cr -= cost;
        const before = T.o.lv, snap = T.rel ? JSON.parse(JSON.stringify(T.o)) : null;
        const left = T.rel ? relicAddXp(T.o, xp) : addXp(T.o, xp, T.need, T.cap);
        if (left > 0) { const back = decompose(T.fam, left); for (const k in back) give(S, k, back[k]); }
        save(); closeModal(); rerender();
        toast(T.o.lv > before ? "Nível " + before + " → " + T.o.lv : "EXP aplicada.");
        if (T.rel) relicReport(T.o, snap);
        return;
      }
      draw();
    }
  });
  draw();
}
function openAscend(kind, ref) {
  let o, el, r, nm;
  if (kind === "c") { o = S.chars[ref]; const c = CAT.chars[ref]; el = c.el; r = c.r; nm = c.nm; }
  else { o = S.wpns.find(x => x.u === ref); const i = wInfo(o, CAT); el = i.el; r = o.r; nm = i.nm; }
  const cost = ascCost(kind, el, o.asc, r);
  if (!cost) return;
  const gate = kind === "c" ? ascGate(S, o.asc) : 0;
  if (gate && S.tower < gate) return modal(`<h3>Ascensão bloqueada</h3><p class="note">Para ascender ${esc(nm)} ao nível máximo ${CAPS[o.asc + 1]}, vença o andar <b>${gate}</b> da Torre (você está no ${S.tower}). A Torre controla até onde os personagens podem subir, como o Nível de Desbravamento do HSR.</p><div class="macts"><button class="pillb dk" data-m="h">Ver itens</button><button class="pillb gold" data-m="t">Ir à Torre</button></div>`, { light: true, on: a => { closeModal(); if (a === "t") go("tower"); else helpAsc(kind, ref); } });
  const okAll = cost.m.every(([id, q]) => have(S, id) >= q) && S.cr >= cost.cr;
  modal(`<h3>Ascensão</h3><div class="note">${esc(nm)} · Nível máximo ${CAPS[o.asc]} → <b style="color:var(--ok)">${CAPS[o.asc + 1]}</b></div>
    <div class="need">${cost.m.map(([id, q]) => `<div>${matIco(id)}<span class="${have(S, id) >= q ? "ok" : "bad"}">${have(S, id)}/${q}</span><small>${esc(MATS[id].n)}</small></div>`).join("")}
    <div>${matIco("cr")}<span class="${S.cr >= cost.cr ? "ok" : "bad"}">${fmtN(cost.cr)}</span><small>Créditos</small></div></div>
    <p class="note">Materiais vêm da ${kind === "c" ? "Sombra" : "Forja"} ${EL[el].art} ${EL[el].w}. Tier 2 libera no estágio II (Torre 30) e tier 3 no estágio III (Torre 60).</p>
    <div class="macts">${okAll ? "" : `<button class="pillb dk" data-m="dun">Ir às masmorras</button>`}<button class="pillb gold" data-m="ok" ${okAll ? "" : "disabled"}>Ascender</button></div>`, {
    on: a => {
      if (a === "dun") { closeModal(); UI.dcat = kind; go("dun"); return; }
      if (a !== "ok") return;
      for (const [id, q] of cost.m) S.mats[id] -= q;
      S.cr -= cost.cr; o.asc++;
      save(); closeModal(); rerender(); toast("Ascensão concluída: nível máximo " + CAPS[o.asc] + ".");
    }
  });
}

/* ---------- desejar ---------- */
function doPull(n) {
  const ban = curBanner();
  if (!ban) return;
  const bid = ban.type;
  if (!canPull(S, n)) return modal(`<h3>Inventário de Cones cheio</h3><p class="note">Você tem ${S.wpns.length}/${WCAP} Cones de Luz. Cada desejo pode render um Cone, então descarte alguns para continuar.</p><div class="macts"><button class="pillb" data-m="inv">Abrir inventário</button></div>`, { light: true, on: a => { if (a === "inv") { closeModal(); UI.inv = "w"; UI.bulk = true; go("inv"); } } });
  const c = pullCost(S, bid, n), pass = CUR[c.pass];
  const run = () => {
    S[c.pass] -= c.usePass; S.ast -= c.ast;
    const rs = []; for (let i = 0; i < n; i++) rs.push(rollOne(S, CAT, ban));
    save(); playPull(rs, n);
  };
  if (c.ast > 0) {
    if (!c.ok) return modal(`<h3>Astrita insuficiente</h3><p class="note">Faltam ${n - c.usePass} ${pass.n}. Seriam necessárias ${fmtN(c.ast)} Astrita, e você tem ${fmtN(S.ast)}. Troque Brilho ou Poeira Estelar na loja.</p><div class="macts"><button class="pillb" data-m="shop">Abrir loja</button></div>`, { light: true, on: a => { if (a === "shop") openShop(); } });
    return confirmBox("Trocar Astrita", `Faltam ${n - c.usePass} ${pass.n}. Usar <b>${fmtN(c.ast)} Astrita</b> (${PULL_COST} cada) para completar?`, "Trocar e desejar", run, true);
  }
  run();
}
let adv = null, skipAll = false;
const waitAdv = ms => new Promise(r => { adv = r; setTimeout(r, skipAll ? 0 : ms); });
$("#pull").addEventListener("click", e => { if (e.target.closest("button")) return; if (adv) adv(); });
$("#skip").addEventListener("click", () => { skipAll = true; if (adv) adv(); });
async function playPull(rs, n) {
  const pull = $("#pull"), top = Math.max(...rs.map(r => r.r));
  const mc = top === 5 ? "#F7C35B" : top === 4 ? "#C69BFF" : "#8EC8FF";
  skipAll = false;
  pull.style.setProperty("--mc", mc);
  $("#rev").className = "rev"; $("#sum").className = "sum"; $("#skip").hidden = false;
  pull.classList.add("on"); pull.classList.remove("go"); void pull.offsetWidth; pull.classList.add("go");
  await waitAdv(2700);
  const show = n === 1 ? rs : rs.filter(r => r.r >= 4).sort((a, b) => a.r - b.r);
  for (const r of show) {
    if (skipAll) break;
    if (typeof playSummon === "function") { $("#rev").className = "rev"; await playSummon(r, waitAdv); if (skipAll) break; }
    const col = RC[r.r];
    pull.style.setProperty("--mc", col);
    $("#rev").innerHTML = `<div class="rart">${r.spr ? img(r.spr, r.nm) : `<span class="ico" style="--rc:${col}">${G(r.kind === "c" ? "swordwoman" : r.kind === "x" ? "polar-star" : r.ic || "broadsword")}</span>`}</div>
      <div class="rinfo"><b>${esc(r.nm)}${elb(r.el)}</b>${stars(r.r)}<small>${r.kind === "c" ? "Personagem" : r.kind === "w" ? "Cone de Luz" : "Compensação"}${r.note ? " · " + esc(r.note) : ""}</small></div>`;
    $("#rev").className = "rev on" + (SUMMON_FX[r.id] ? " sig " + SUMMON_FX[r.id].cls : "");
    await waitAdv(r.r >= 5 ? 3200 : 2200);
  }
  $("#rev").className = "rev";
  const sorted = [...rs].sort((a, b) => b.r - a.r || (a.kind === "c" ? -1 : 1));
  $("#sum").innerHTML = `<div class="sum-row">${sorted.map((r, i) => `<div class="sc" style="--rc:${RC[r.r]};--i:${i}" title="${esc(r.nm)}">${r.spr ? img(r.spr, r.nm) : G(r.kind === "c" ? "swordwoman" : r.kind === "x" ? "polar-star" : r.ic || "broadsword")}<div class="sb">${elb(r.el)}${stars(r.r)}<em>${esc(r.nm)}</em></div></div>`).join("")}</div>
    <div class="macts" style="justify-content:center"><button class="pillb" data-a="pullx">Fechar</button><button class="pillb gold" data-a="pull" data-v="${n}">Desejar ×${n} de novo</button></div>`;
  $("#sum").className = "sum on"; $("#skip").hidden = true; adv = null;
  renderWish(); renderRail();
}

    stam(S); S.st.v = Math.min(999, S.st.v + n * GIFT);
    toast("+" + n * GIFT + " de Fôlego recebido.");
  }
  save(); await pushProfile(true); renderSoc(); renderHud(); renderRail();
}

function lcDetCol(w, i, cap) {
  const s = wStats(w, CAT), eqc = w.eq && CAT.chars[w.eq];

function lcLvlCol(w, i, cap) {

  const need = needToCap(w, l => wNeed(l, w.r));
  if (!Object.keys(LCV.xp).length) LCV.xp = autoXp("w", Math.min(need, wNeed(w.lv, w.r) - w.xp), S.mats);
  const xp = selXp("w", LCV.xp), pv = previewXp(w, xp, l => wNeed(l, w.r), cap), n = wStats(w, CAT, pv.lv, w.asc), cost = Math.round(xp * 0.1);
  return `<h2 class="lcnm">Aprimorar</h2>
    <div class="lvp"><span>Nv.</span><b>${w.lv}</b><span>→</span><b class="to">${pv.lv}</b><span>/ ${cap}</span></div>

    <div class="ttl">${esc(R.n)} · Nv. ${e.lv}</div><h3>${esc(e.nm)} ${elb(e.el)}</h3>

    <div class="ttl">Resistência elemental</div><div class="resg">${ELS.map(el => { const b0 = B.resBase(e, el), now = B.resOf(e, el); return `<div style="--ec:${EL[el].c}">${G(EL[el].ic)}<span>${EL[el].n}</span><b>${b0 !== now ? `<s>${b0}%</s> → ${Math.round(now)}%` : b0 + "%"}</b></div>`; }).join("")}</div>
    <div class="ttl">RES a Efeito</div><p class="note">${Math.round(B.eresOf(e))}%${sres.length ? " · " + sres.map(([k, v]) => ({ frz: "Congelamento", stun: "Atordoamento", slow: "Lentidão", dot: "Dano contínuo" }[k] || k) + " " + Math.round(v * 100) + "%").join(" · ") : ""}</p>
    <div class="ttl">Efeitos ativos</div>${effs.length ? `<ul class="effl">${effs.map(x => `<li>${esc(x.n)}<b>${x.t >= 90 ? "permanente" : x.t + " turno(s)"}</b></li>`).join("")}</ul>` : `<p class="note">Nenhum.</p>`}
    ${mech.length ? `<div class="ttl">Mecânica</div><ul class="note" style="margin:0;padding-left:18px">${mech.map(m => `<li>${esc(m)}</li>`).join("")}</ul>` : ""}</div>`;
}
function buffName(b) {
  const k = b.k;
  if (k === "spd") return (b.v < 0 ? "Lentidão" : "VEL") + " " + (b.v > 0 ? "+" : "") + b.v + "%";
  if (k === "defd") return "DEF −" + b.v + "%";
  if (k === "vul") return "Vulnerabilidade +" + b.v + "%";
  if (k.startsWith("vul_")) return "Dano de " + EL[k.slice(4)].n + " recebido +" + b.v + "%";
  if (k.startsWith("resd_")) return "RES a " + EL[k.slice(5)].n + " −" + b.v;
  if (k === "dr") return "Redução de dano " + b.v + "%";
  if (k.startsWith("dmgfrom_")) { const c = CAT.chars[k.slice(8)]; return "Dano recebido de " + (c ? c.nm : "um aliado") + " +" + b.v + "%"; }
  if (k === "clone") return "Próximo Ataque Básico: golpe adicional do clone";
  if (k === "dmg_b" || k === "dmg_s" || k === "dmg_u") return "Dano " + { dmg_b: "do Ataque Básico", dmg_s: "da Perícia", dmg_u: "da Suprema" }[k] + " +" + b.v + "%";
  if (k.startsWith("dotb_")) return "Dano contínuo recebido +" + b.v + "%";
  return (L[k] || k) + " " + (b.v > 0 ? "+" : "") + b.v + "%";
}

async function saveRelicImages(k) {
  const slots = SETS[k].kind === "orn" ? ORN_SLOTS : RELIC_SLOTS;
  try {
    for (const sl of slots) {
      const id = "ri_" + k + "_" + sl, url = readUrl("ri-url-" + k + "-" + sl);
      if (url === null) return;
      const f = $("#ri-file-" + k + "-" + sl) && $("#ri-file-" + k + "-" + sl).files[0], prev = (CAT.wpns[id] || {}).spr || "";
      let spr = url || (f ? (await RT.assets.upload(f)).id : isUrl(prev) ? "" : prev);
      if (spr === prev) continue;
      if (spr) await RT.db.collection("wpns").doc(id).set({ builtin: true, nm: id, spr }); else if (prev) await RT.db.collection("wpns").doc(id).delete();
    }
    toast("Imagens de " + SETS[k].nm + " salvas.");
  } catch (e) { toast("Não foi possível salvar: " + (e.message || e.code || e)); }
}
/* relatório depois de aprimorar relíquia: principal antes/depois e cada marco (+3/+6/...) com o roll recebido */
function relicReport(R, before) {
  const evs = R.evs || [];
  if (!evs.length && R.lv === before.lv) return;
  const vals = {}; for (const s of before.subs) vals[s.k] = rSub(s, before);
  const lines = evs.map(e => {
    const v = rRoll(R.r, e.k, e.t), old = vals[e.k] || 0; vals[e.k] = old + v;
    const f = x => fmtS(PCT[e.k] || FLAT.has(e.k) ? (PCT[e.k] ? "x" : e.k) : "x", x);

function fx(cls, x, y, html = "", life = 1000, style = "", host = SBX()) {
  if (!host) return null;

  d.className = "cfx " + cls; d.style.cssText = `left:${x}px;top:${y}px;${style}`; d.innerHTML = html;
  host.appendChild(d); setTimeout(() => d.remove(), life); return d;
}
function fxLine(a, b, cls, life = 700, style = "") {
  const dx = b.x - a.x, dy = b.y - a.y;
  return fx("ln " + cls, a.x, a.y, "<i></i>", life, `width:${Math.hypot(dx, dy)}px;transform:rotate(${Math.atan2(dy, dx)}rad);${style}`);
}
function fxScreen(cls, life = 1200, html = "", host = SBX()) {

  const b = (m, n) => `<button class="pillb sm${GFX.mode === m ? " gold" : " dk"}" data-a="gfx" data-v="${m}" aria-pressed="${GFX.mode === m}">${n}</button>`;
  return `<div class="card"><div class="ttl">Desempenho</div>
    <div class="macts" style="justify-content:flex-start">${b("auto", "Automático")}${b("hi", "Alto")}${b("lite", "Leve")}</div>
    <p class="note">Gráficos ${GFX.lite ? "<b>leves</b>" : "<b>completos</b>"} neste aparelho${GFX.mode === "auto" ? " (escolhido automaticamente)" : ""}. Se o jogo travar, use <b>Leve</b>: tira as partículas do fundo, as animações em loop e os filtros pesados.</p></div>`;
}
applyGfx();

/* ---------- partículas do fundo (30 quadros/s, resolução 1× no celular) ---------- */
(() => {
  const cv = $("#fx"), cx = cv.getContext("2d"), rm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const pal = ["#E9EEF8", "#80CFFF", "#A38BFF", "#E3C78A"];
  let W = 0, H = 0, d = 1, P = [], mx = 0.5, last = 0, n = 0, t0 = 0, drawn = true;
  function size() {
    const sm = innerWidth < 700;
    d = sm ? 1 : Math.min(devicePixelRatio || 1, 1.5); W = cv.width = innerWidth * d; H = cv.height = innerHeight * d;
    P = Array.from({ length: sm ? 26 : 60 }, () => ({ x: Math.random() * W, y: Math.random() * H, z: 0.3 + Math.random() * 0.7, s: (1 + Math.random() * 1.5) * (sm ? 1.3 : 1), v: (0.12 + Math.random() * 0.44) * d, c: pal[Math.random() * 4 | 0] }));
  }
  function tick(t) {
    requestAnimationFrame(tick);
    /* teste de desempenho nos primeiros quadros com a página visível (só no modo Automático) */
    if (!document.hidden && t0 >= 0) { if (!t0) t0 = t; else if (++n === 90) { if ((t - t0) / 89 > 25 && !GFX.slow) { GFX.slow = true; applyGfx(); } t0 = -1; } }
    if (GFX.lite) { if (drawn) { cx.clearRect(0, 0, W, H); drawn = false; } return; }
    if (t - last < 32) return; /* 30 quadros/s bastam para partículas lentas */
    last = t;
    if (!document.hidden && !UI.wish && !B) {
      drawn = true;
      cx.clearRect(0, 0, W, H);
      for (const p of P) {
        if (!rm) { p.y -= p.v; if (p.y < -5) p.y = H + 5; }
        cx.globalAlpha = (0.2 + 0.5 * Math.abs(Math.sin(t / 1500 * p.z + p.x))) * p.z;
        cx.fillStyle = p.c; cx.beginPath(); cx.arc(p.x + (mx - 0.5) * 36 * p.z * d, p.y, p.s * p.z * d, 0, 7); cx.fill();
      }
    }
  }
  addEventListener("pointermove", e => { mx = e.clientX / innerWidth; });
  addEventListener("resize", size); size(); requestAnimationFrame(tick);
})();

/* ---------- início ---------- */
loadLocal();
stam(S); relicRuns(S);
go("char");
setInterval(() => { if (!document.hidden && !B) { renderHud(); if (UI.scr === "dun" && !$("#mod").classList.contains("on")) { const v = stam(S); const b = $("#s-dun .card b"); if (b) b.textContent = v + "/" + ST_MAX; } } }, 1000);
initRuntime().catch(() => { });

</script>
